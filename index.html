const FOUR={ocular:['0|Sem abertura ao estímulo','1|Abre ao estímulo doloroso','2|Abre à voz forte','3|Olhos abertos, sem acompanhar','4|Acompanha ou pisca ao comando'],motora:['0|Sem resposta ou mioclonia generalizada','1|Extensão ao estímulo','2|Flexão ao estímulo','3|Localiza estímulo','4|Faz gesto ao comando'],tronco:['0|Reflexos pupilar, corneano e tosse ausentes','1|Pupilar e corneano ausentes','2|Pupilar ou corneano ausente','3|Uma pupila dilatada e fixa','4|Pupilar e corneano presentes'],respiracao:['0|Apneia ou frequência igual à do ventilador','1|Respira acima da frequência do ventilador','2|Sem intubação, ritmo irregular','3|Sem intubação, Cheyne–Stokes','4|Sem intubação, ritmo regular']};
const PAINAD={resp:['0|Respiração normal','1|Dificuldade ocasional / hiperventilação breve','2|Dificuldade ruidosa, hiperventilação prolongada ou Cheyne–Stokes'],voz:['0|Sem vocalização negativa','1|Gemidos ocasionais / fala negativa baixa','2|Chamados repetidos, gemidos altos ou choro'],face:['0|Sorriso ou expressão neutra','1|Tristeza, medo ou testa franzida','2|Caretas'],corpo:['0|Relaxado','1|Tensão / inquietação','2|Rigidez, punhos cerrados, defesa ou agressividade'],consolo:['0|Não necessita consolo','1|Consolável por voz ou toque','2|Não consolável']};
const CPOT={face:['0|Face relaxada','1|Face tensa','2|Careta'],corpo:['0|Sem movimento ou posição normal','1|Movimentos de proteção','2|Agitação'],musculo:['0|Sem resistência passiva','1|Resistência ao movimento','2|Resistência intensa / movimento impedido'],ventilador:['0|Tolera a ventilação','1|Tosse, mas tolera','2|Assincronia persistente'],voz:['0|Voz normal ou silêncio','1|Suspiros ou gemidos','2|Gritos ou choro']};
const MADDOX=['0 — Sítio íntegro, sem sinais de flebite','1 — Dor ou rubor próximo da inserção','2 — Dois sinais entre dor, rubor e edema','3 — Dor, rubor e edema','4 — Sinais anteriores e cordão venoso','5 — Sinais anteriores e secreção purulenta'];
const SOURCES=[
 ['Glasgow — referência oficial','https://www.glasgowcomascale.org/downloads/GCS-Assessment-Aid-Brazilian.pdf'],

 ['Anvisa — prevenção de infecção de corrente sanguínea','https://www.gov.br/anvisa/pt-br/centraisdeconteudo/publicacoes/servicosdesaude/publicacoes/Protocolo1PrevenodeIPCS_1.pdf'],
 ['Cofen 736/2024 — Processo de Enfermagem','https://www.cofen.gov.br/resolucao-cofen-no-736-de-17-de-janeiro-de-2024/'],
 ['Cofen 754/2024 — registros eletrônicos','https://www.cofen.gov.br/resolucao-cofen-no-754-de-16-de-maio-de-2024/'],
 ['Coren-SP — Processo de Enfermagem','https://portal.coren-sp.gov.br/wp-content/uploads/2025/04/processo_de_enfermagem.pdf']
];
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled=x=>x!==''&&x!==null&&x!==undefined;
const arr=x=>Array.isArray(x)?x:[];
const value=(o,path)=>path.split('.').reduce((a,k)=>a?.[k],o);
function put(o,path,val){const keys=path.split('.');if(keys.some(k=>['__proto__','prototype','constructor'].includes(k)))throw Error('Campo inválido');let target=o;keys.slice(0,-1).forEach((k,i)=>{if(target[k]===undefined)target[k]=/^\d+$/.test(keys[i+1])?[]:{};target=target[k];});target[keys.at(-1)]=val;}
function localISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function dateBR(s){if(!s)return '';const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s);}
function stampBR(s){if(!s)return '';const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleString('pt-BR'):s;}
function blankVisit(){return {
 schema:3,carryTaskKeys:[],sector:'',general:{},neuro:{scale:'Glasgow',gcs:{},four:{}},pain:{scale:'Numérica',painad:{},cpot:{}},
 respiratory:{sounds:[],relevant:false},cardio:{},abdomen:{},mobility:{},skin:{colors:[],wounds:[],phlebitis:[],prevention:[]},
 urinary:{},bowel:{},safety:{},nutrition:{routes:[]},devices:[],infusions:[],finish:{},findings:'',deviceNotes:'',events:'',results:'',plan:'',manualTask:''
};}
function newDevice(type){return {id:uid(),type,site:'',siteOther:'',fixationSite:'',side:'',caliber:'',date:'',dateUnknown:false,time:'',dressing:{},enteral:{},drain:{}};}
function blankDB(){return {version:3,patients:[],tasks:[],settings:{avpHours:48,dressingDays:7}};}

function sumScale(values,ranges){if(values.length!==ranges.length||values.some((x,i)=>!filled(x)||x==='NT'||!Number.isInteger(Number(x))||Number(x)<ranges[i][0]||Number(x)>ranges[i][1]))return null;return values.reduce((a,b)=>a+Number(b),0);}
function neuroText(v){const n=v.neuro||{};
 if(n.scale==='Glasgow'){const a=['ao','rv','rm'].map(k=>n.gcs?.[k]);if(!a.some(filled))return '';const total=sumScale(a,[[1,4],[1,5],[1,6]]);return `Glasgow ${total===null?'sem total calculável':total+'/15'} (AO – ${a[0]||'não avaliada'}, RV – ${a[1]||'não avaliada'}, RM – ${a[2]||'não avaliada'})${n.reason?'; limitação: '+n.reason:''}`;}
 if(n.scale==='AVDI')return n.avdi?'AVDI: '+n.avdi:'';
 if(n.scale==='FOUR'){const keys=['ocular','motora','tronco','respiracao'],a=keys.map(k=>n.four?.[k]);if(!a.some(filled))return '';const total=sumScale(a,keys.map(()=>[0,4]));return `FOUR ${total===null?'incompleto':total+'/16'} (${keys.map((k,i)=>k+': '+(filled(a[i])?a[i]:'não avaliado')).join(', ')})`;}
 if(n.scale==='NIHSS'&&filled(n.nihss))return `NIHSS ${n.nihss}/42, resultado registrado a partir da avaliação com instrumento institucional${n.reason?' ('+n.reason+')':''}`;
 return '';
}
function painText(v){const p=v.pain||{};if(p.unable)return 'dor: não foi possível avaliar'+(p.reason?' ('+p.reason+')':'');let score=null,max=10;
 if(p.scale==='Numérica')score=sumScale([p.score],[[0,10]]);
 if(p.scale==='Faces')score=[0,2,4,6,8,10].includes(Number(p.face))&&filled(p.face)?Number(p.face):null;
 if(p.scale==='PAINAD')score=sumScale(['resp','voz','face','corpo','consolo'].map(k=>p.painad?.[k]),Array(5).fill([0,2]));
 if(p.scale==='CPOT'){max=8;if(p.mode)score=sumScale(['face','corpo','musculo',p.mode==='Intubado'?'ventilador':'voz'].map(k=>p.cpot?.[k]),Array(4).fill([0,2]));}
 const partial=(p.scale==='PAINAD'&&Object.values(p.painad||{}).some(filled))||(p.scale==='CPOT'&&Object.values(p.cpot||{}).some(filled));
 if(score===null&&!partial&&!p.location)return '';
 return `avaliação da dor por ${p.scale}${score===null?' incompleta':': '+score+'/'+max}${p.location?', localização: '+p.location:''}${p.notes?', '+p.notes:''}`;
}
function deviceName(d){return d.type==='Outro'?(d.otherType||'Outro dispositivo'):d.type;}

function ageHours(d,now=new Date()){if(d.dateUnknown||!d.date||!d.time)return null;const t=new Date(d.date+'T'+d.time);return Number.isFinite(t.getTime())?(now-t)/3600000:null;}
function dayAge(s,now=new Date()){if(!s)return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;return (Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(+m[1],+m[2]-1,+m[3]))/86400000;}
function automaticTasks(v,settings,now=new Date()){

function nutritionUI(){const n=visit().nutrition;return `${choices('nutrition.routes','Via / situação da dieta',['Dieta oral','Dieta enteral','Jejum'],true)}${arr(n.routes).includes('Dieta oral')?choices('nutrition.acceptance','Aceitação da dieta oral',['Boa aceitação','Aceitação parcial','Sem aceitação','Não avaliada']):''}${arr(n.routes).includes('Jejum')?input('nutrition.reason','Motivo do jejum'):''}${arr(n.routes).includes('Dieta enteral')?linkedDeviceUI('nutrition.deviceId','Sonda enteral'):''}`;}
function devicesUI(){const v=visit();return `<div class="actions">${DEVICE_TYPES.map(t=>btn('+ '+t,'add-device',`data-type="${t}"`,'secondary small')).join('')}</div>${v.devices.map((d,i)=>`<details class="repeater" data-open="device-${d.id}" ${ui.open.has('device-'+d.id)?'open':''}><summary>${esc(deviceLabel(d))} <span class="badge dim">${i+1}</span></summary><div class="toolbar">${d.type==='Outro'?input('devices.'+i+'.otherType','Nome do dispositivo'):''}${btn('Remover dispositivo','remove-device',`data-id="${d.id}"`,'danger small')}</div>${deviceFields(d,i)}</details>`).join('')||'<p class="empty">Nenhum dispositivo cadastrado. Use os botões acima.</p>'}${textArea('deviceNotes','Observações adicionais dos dispositivos')}`;}

function finishUI(){const f=visit().finish;return `${textArea('events','Intercorrências, comunicação à equipe e condutas realmente realizadas')}${textArea('results','Resposta aos cuidados / reavaliação')}${textArea('plan','Planejamento / continuidade da assistência')}<div class="nested"><h3>Pendência manual</h3>${input('manualTask','Escreva a pendência — entra no quadro automaticamente','text','placeholder="Ex.: providenciar material"')}${btn('+ Outra pendência','next-manual-task','', 'ghost small')}<p class="muted">As pendências dos achados e dispositivos já são incluídas automaticamente.</p><div id="visit-task-summary">${currentTaskSummary()}</div></div><div class="grid">${check('finish.fall','Orientação sobre risco de queda realizada')}${check('finish.pressure','Orientação sobre prevenção de lesão por pressão realizada')}${check('finish.bell','Campainha ao alcance')}${check('finish.belongings','Utensílios pessoais ao alcance')}${check('finish.call','Orientado a chamar a equipe quando necessário')}</div>${f.fall||f.pressure?`<div class="grid">${choices('finish.recipient','Quem recebeu as orientações?',['Paciente','Acompanhante','Paciente e acompanhante'])}${input('finish.understanding','Compreensão / limitações observadas')}</div>`:''}<div class="nested">${check('finish.palliative','Paciente em cuidados paliativos')}</div>`;}
function currentTaskSummary(){return openTasks(db,ui.current).map(t=>`<p class="muted">• ${esc(t.text)}</p>`).join('')||'<p class="muted">Nenhuma pendência aberta.</p>';}

function visitView(){const p=patient();if(!p||p.status!=='active')return visitPatientList();const v=visit();return `${visitPatientList()}

function dashboard(){const active=activePatients(),list=db.patients.filter(p=>(ui.filter==='all'||p.status==='active')&&[p.bed,p.code,p.record,p.sector].join(' ').toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>a.bed.localeCompare(b.bed,'pt-BR',{numeric:true}));return `<section><div class="stats"><div class="stat"><strong>${active.length}</strong><span>Em acompanhamento</span></div><div class="stat"><strong>${active.filter(p=>p.visit).length}</strong><span>Com visita salva</span></div><div class="stat"><strong>${active.reduce((n,p)=>n+openTasks(db,p.id).length,0)}</strong><span>Pendências abertas</span></div></div><div class="card"><div class="toolbar"><h2>Pacientes</h2>${btn('+ Admissão','admission-new','','')}</div><div class="grid"><div class="field"><label>Buscar leito ou identificação</label><input data-search value="${esc(ui.search)}" placeholder="Ex.: 224B"></div><div class="field"><label>Mostrar</label><select data-patient-filter><option value="active" ${ui.filter==='active'?'selected':''}>Em acompanhamento</option><option value="all" ${ui.filter==='all'?'selected':''}>Todos, inclusive desfechos</option></select></div></div>${list.map(p=>`<article class="patient"><div><strong>${esc(p.bed)} · ${esc(p.code)}</strong><small>${esc(p.sector)} · Registro ${esc(p.record||'não informado')}</small><small>${p.visit?'Visita: '+stampBR(p.visit.savedAt):'Sem visita salva'}${p.dirty?' · Rascunho em edição':''}</small><span class="badge ${openTasks(db,p.id).length?'warn':'dim'}">${openTasks(db,p.id).length} pendência(s)</span></div><div class="actions">${p.status==='active'?btn('Visitar','open-patient',`data-id="${p.id}"`,''):''}${btn('Editar','admission-edit',`data-id="${p.id}"`,'ghost')}${p.visit?btn('Evolução','open-report',`data-id="${p.id}"`,'secondary'):''}${p.status==='active'?`<select data-outcome="${p.id}" aria-label="Desfecho do leito ${esc(p.bed)}" style="width:160px"><option value="">Desfecho…</option><option>Alta</option><option>Transferência</opt function taskRow(t){return `<div class="task ${t.done||t.resolved?'done':''}"><div><p>${esc(t.text)}</p><small class="muted">${t.done?'Concluída em '+stampBR(t.doneAt):t.resolved?'Condição atualizada — não marcada como executada':t.autoKey?'Gerada automaticamente':'Incluída manualmente'}</small></div>${t.done?btn('Reabrir','task-reopen',`data-id="${t.id}"`,'ghost small'):t.resolved?'':btn('Concluir','task-done',`data-id="${t.id}"`,'secondary small')}</div>`;}

function identity(p){return `<div class="identity"><strong>Leito ${esc(p.bed)} · ${esc(p.code)}</strong><span>Registro: ${esc(p.record||'não informado')} · ${esc(p.sector)}</span><p class="muted">Visita salva: ${stampBR(p.visit?.savedAt)||'não salva'}</p></div>`;}
function reportView(){const candidates=db.patients.filter(p=>p.visit),p=candidates.find(p=>p.id===ui.reportId)||candidates.find(p=>p.id===ui.current)||candidates[0];if(p)ui.reportId=p.id;return `<section class="card print-target"><div class="toolbar no-print"><h2>Evolução em texto corrido</h2><div class="actions">${btn('Copiar todas as evoluções','batch-open','','')}${btn('Copiar esta evolução','copy-one','', 'secondary')}${btn('Imprimir','print','', 'ghost')}</div></div><div class="field no-print"><label>Paciente — confira antes de copiar</label><select data-report-patient>${candidates.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>Leito ${esc(x.bed)} · ${esc(x.code)} · ${stampBR(x.visit.savedAt)}</option>`).join('')}</select></div>${p?`${identity(p)}${p.dirty?'<p class="notice no-print">Há um rascunho em edição. Esta é a última visita salva; salve a visita para atualizar a evolução.</p>':''}<p class="note no-print">Destaques indicam achados relevantes. Copie somente após conferir a identificação e revisar o texto.</p><div class="report" id="report-text">${esc(buildReport(p).when)} — ${buildReport(p).segments.map(s=>s.important?`<mark>${esc(s.text)}</mark>`:esc(s.text)).join(' ')}</div><div class="only-print print-signature">Conferido por: ______________________________ &nbsp; Registro profissional: __________________</div>`:'<p class="empty">Salve uma visita para gerar a evolução.</p>'}</section>`;}
function settingsView(){return `<section class="card"><h2>Dados e configuração</h2><p class="note">Os dados ficam neste navegador e não são sincronizados entre aparelhos. Exporte um backup antes de atualizar ou trocar de aparelho.</p><div class="actions">${btn('Exportar backup JSON','export-json','','')}<label class="btn secondary">Importar backup<input type="file" id="import-backup" accept=".json,application/json" hidden></label></div><hr><h3>Prazos do serviço</h3><div class="grid"><div class="field"><label>Avaliar AVP após (horas)</label><input data-setting="avpHours" type="number" min="1" max="720" value="${db.settings.avpHours}"></div><div class="field"><label>Curativos de outros acessos venosos (dias)</label><input data-setting="dressingDays" type="number" min="1" max="30" value="${db.settings.dressingDays}"></div></div><p class="muted">Valores iniciais solicitados: AVP 48h e curativos 7 dias. São alertas configurados, não uma validade universal ou indicação automática de retirada. Adeque ao protocolo e ao tipo de cobertura. Cateter longo sem expiração por permanência; seu curativo continua monitorado.</p></section><section class="card"><h2>Referências e limites das escalas</h2><p class="note">Glasgow, AVDI e FOUR têm registro por componentes. NIHSS registra o resultado obtido no instrumento completo. Faces registra a pontuação escolhida no instrumento oficial do serviço, sem substituir as imagens por desenhos não validados. PAINAD e CPOT não têm pontuação presumida para itens vazios.</p><ul>${SOURCES.map(([label,url])=>`<li><a href="${url}" target="_blank" rel="noopener">${label}</a></li>`).join('')}</ul><p class="muted">Protótipo de apoio à documentação, sem integração ao prontuário. Resultados e textos exigem conferência profissional. Versão ${APP_VERSION}.</p></section>`;}
function admissionModal(){const a=ui.admission||{};const field=(key,label,type='text')=>`<div class="field"><label for="ad-${key}">${label}</label><input id="ad-${key}" data-admission="${key}" type="${type}" value="${esc(a[key]||'')}"></div>`;return `<div class="modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="admission-title"><header class="modal-head"><h2 id="admission-title">${a.id?'Editar paciente':'Adicionar paciente'}</h2>${btn('Fechar','close-modal','','ghost small')}</header><p class="muted">Editar mantém as visitas, dispositivos e pendências no mesmo cadastro.</p><div class="grid">${field('bed','Leito *')}${field('code','Identificação do paciente *')}${field('record','Registro / prontuário (opcional)')}<div class="field"><label>Setor</label><select data-admission="sector">${SECTORS.map(s=>`<option ${a.sector===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${field('date','Data da admissão','date')}${field('time','Hora da admissão (HH:mm)')}${field('origin','Procedência')}${field('reason','Motivo da admissão')}</div><div class="field"><label>Informações da admissão</label><textarea data-admission="notes">${esc(a.notes||'')}</textarea></div><div class="actions">${btn(a.id?'Salvar correções':'Cadastrar e iniciar visita','admission-save','','')}${btn('Cancelar','close-modal','','ghost')}</div></section></div>`;}
function batchModal(){const pats=activePatients().filter(p=>p.visit?.savedAt).sort((a,b)=>a.bed.localeCompare(b.bed,'pt-BR',{numeric:true}));return `<div class="modal-bg"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="batch-title"><header class="modal-head"><h2 id="batch-title">Copiar evoluções por paciente</h2>${btn('Fechar','close-modal','','ghost small')}</header><p class="note">Última visita salva de cada paciente selecionado. Rascunhos não salvos não entram na cópia. Os cabeçalhos servem para conferência; cada prontuário recebe apenas a evolução correspondente.</p>${pats.map(p=>`<label class="check"><input type="checkbox" data-batch-id="${p.id}" ${ui.batchIds.includes(p.id)?'checked':''}><span><strong>Leito ${esc(p.bed)} · ${esc(p.code)}</strong> · Registro ${esc(p.record||'não informado')}<small class="muted"> · ${stampBR(p.visit.savedAt)}${p.dirty?' · possui rascunho em edição':''}</small></span></label>`).join('')||'<p class="empty">Nenhuma visita salva em pacientes ativos.</p>'}<div class="actions">${btn('Preparar prévia separada','batch-preview','','secondary')}${btn('Copiar bloco revisado','batch-copy',ui.batchText?'':'disabled','')}</div>${ui.batchText?`<div class="field"><label>Prévia — início e fim identificados de cada evolução</label><textarea id="batch-copy-text" readonly style="min-height:330px">${esc(ui.batchText)}</textarea></div>`:''}</section></div>`;}
function render(){fieldCount=0;let scroll=window.scrollY;const focused=document.activeElement?.dataset.field,selection=document.activeElement?.selectionStart;
 const title={painel:['Acompanhamento','Painel de pacientes'],visita:['À beira-leito','Visita de enfermagem'],pendencias:['Continuidade do cuidado','Pendências por leito'],evolucao:['Registro assistencial','Evoluções de enfermagem'],dados:['Seu espaço de trabalho','Dados e referências']}[ui.tab];
 const content={painel:dashboard,visita:visitView,pendencias:tasksView,evolucao:reportView,dados:settingsView}[ui.tab]();
 $('#app').innerHTML=`<div class="shell"><aside><div class="brand"><span>✚</span> Ronda<small>VISITA DE ENFERMAGEM</small></div>${[['painel','▦ Pacientes'],['visita','✎ Visitas'],['pendencias','☑ Pendências'],['evolucao','▤ Evoluções'],['dados','⚙ Dados']].map(([tab,label])=>`<button class="nav ${ui.tab===tab?'active':''}" data-action="nav" data-tab="${tab}">${label}</button>`).join('')}<div class="sidefoot">Salvo neste navegador<br><span class="version">Ronda ${APP_VERSION}</span></div></aside><main><header class="top"><div><p class="eyebrow">${title[0]}</p><h1>${title[1]}</h1><p class="muted">Avaliar, acompanhar e registrar.</p></div><span class="badge dim">v${APP_VERSION}</span></header>${loadProblem?`<div class="notice error">${esc(loadProblem)}</div>`:''}${ui.storageError?'<div class="notice error">Não foi possível salvar os dados neste navegador. Exporte um backup.</div>':''}${ui.tab==='painel'?`<details class="note no-print"><summary>Protótipo de apoio — dados locais e revisão profissional</summary>Sem autenticação, criptografia de aplicação ou integração ao prontuário institucional. Use dados fictícios nos testes; a instituição deve autorizar o tratamento de dados assistenciais. Confira o texto antes de utilizá-lo.</details>`:''}${content}</main></div>${ui.modal==='admission'?admissionModal():ui.modal==='batch'?batchModal():''}${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}`;
 if(focused){const el=document.querySelector(`[data-field="${focused}"]`);if(el){el.focus({preventScroll:true});try{if(selection!==null)el.setSelectionRange(selection,selection);}catch{}}}window.scrollTo(0,scroll);
}
function navigate(tab){syncCurrent();ui.tab=tab;ui.errors=[];if(tab==='pendencias'||tab==='painel')for(const p of activePatients())syncTasks(db,p,p.draft||p.visit||blankVisit());persist();render();window.scrollTo(0,0);}
function startAdmission(id){syncCurrent();const p=db.patients.find(p=>p.id===id);ui.admission=p?{id:p.id,bed:p.bed,code:p.code,record:p.record,sector:p.sector,date:p.admission?.when?.slice(0,10)||'',time:p.admission?.when?.slice(11,16)||'',origin:p.admission?.origin||'',reason:p.admission?.reason||'',notes:p.admission?.notes||''}:{bed:'',code:'',record:'',sector:SECTORS[0],date:localISO().slice(0,10),time:localISO().slice(11,16),origin:'',reason:'',notes:''};ui.modal='admission';render();$('#ad-bed')?.focus();}
function addDevice(type,link){const v=visit(),d=newDevice(type);v.devices.push(d);if(link)put(v,link,d.id);ui.open.add('device-'+d.id);return d;}
function ensureLinked(path,type){const v=visit();if(v.devices.some(d=>d.id===value(v,path)&&d.type===type))return;const found=v.devices.find(d=>d.type===type);put(v,path,(found||addDevice(type)).id);}
function applyChange(path,newValue){const v=visit();put(v,path,newValue);
 if(path==='nutrition.routes'){
  if(newValue.includes('Dieta enteral'))ensureLinked('nutrition.deviceId','Sonda enteral');
 }
 if(path==='urinary.method'&&newValue==='Sonda vesical')ensureLinked('urinary.deviceId','Sonda vesical');
 if(path==='respiratory.adventitious'&&newValue==='Presentes'&&!v.respiratory.sounds.length)v.respiratory.sounds.push({id:uid(),type:'',sites:[]});
 if(path==='neuro.scale')ui.open.delete('neuro-switch');if(path==='pain.scale')ui.open.delete('pain-switch');
 if(path==='safety.hasAllergy'&&!newValue)v.safety.allergy='';
 if(path==='bowel.unknown'&&newValue)v.bowel.lastDate='';
 if(path.endsWith('.dateUnknown')&&newValue){const base=path.slice(0,-12);put(v,base+'.date','');put(v,base+'.time','');}
 if(path.endsWith('.dressing.unknown')&&newValue)put(v,path.replace(/unknown$/,'date'),'');
 if(path==='respiratory.adventitious'&&newValue==='Ausentes')v.respiratory.sounds=[];
 if(path==='cardio.implant'&&newValue==='Não identificado'){v.cardio.implantSite='';v.cardio.implantSide='';}
 document.querySelectorAll('[data-field]').forEach(el=>{if(el.dataset.field===path){if(el.type==='checkbox')el.checked=!!newValue;else el.value=newValue??'';}});
 const p=patient();if(p)p.dirty=true;syncCurrent();
}
function saveVisit(){const p=patient();if(!p)return;const v=visit();let invalid=[...document.querySelectorAll('#app input[type="number"]')].filter(x=>!x.checkValidity());ui.errors=validateVisit(v);
 for(const x of invalid)ui.errors.push('Valor inválido: '+(document.querySelector(`label[for="${x.id}"]`)?.textContent||x.dataset.field));
 for(const d of v.devices)if(d.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.time))ui.errors.push('Hora inválida em '+deviceLabel(d)+': use HH:mm.');
 for(const i of v.infusions)if(i.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(i.time))ui.errors.push('Hora inválida na infusão '+(i.name||'')+': use HH:mm.');
 if(ui.errors.length){syncCurrent();render();$('.notice.error')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 const time=new Date();manualPending(db,p,v);syncTasks(db,p,v,time);if(p.visit){p.history ||= [];p.history.unshift(clone(p.visit));p.history=p.history.slice(0,50);}
 v.savedAt=time.toISOString();v.taskSnapshot=openTasks(db,p.id).map(t=>t.text);v.schema=3;p.visit=clone(v);p.dirty=false;
 p.visit.identity={bed:p.bed,code:p.code,record:p.record,sector:p.sector};
 if(!persist()){toast('A visita está na memória, mas não foi gravada. Exporte um backup.');return;}
 ui.reportId=p.id;ui.tab='evolucao';render();window.scrollTo(0,0);toast('Visita salva e evolução gerada. Confira antes de copiar.');
}
async function copyText(text){if(!text)return false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch{}const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='0';ta.style.top='0';ta.style.opacity='0';document.body.append(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}catch{}ta.remove();return ok;}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#app').addEventListener('click',async e=>{
 const chip=e.target.closest('[data-choice]');if(chip){const path=chip.dataset.choice;let next=chip.dataset.clear?(chip.dataset.multi?[]:''):chip.dataset.value;
  if(chip.dataset.multi&&!chip.dataset.clear){let xs=[...arr(value(visit(),path))];next=xs.includes(next)?xs.filter(x=>x!==next):[...xs,next];
   const selected=chip.dataset.value;
   if(path==='nutrition.routes'&&next.includes(selected)){next=selected==='Jejum'?['Jejum']:next.filter(x=>x!=='Jejum');}
   if(path==='skin.colors'&&next.includes(selected))for(const [x,y] of [['Corado','Hipocorado'],['Cianótico','Acianótico'],['Ictérico','Anictérico']])if([x,y].includes(selected))next=next.filter(i=>i!==(selected===x?y:x));
   if(path.endsWith('.dressing.state')&&next.includes(selected))next=selected==='Íntegro'?['Íntegro']:next.filter(x=>x!=='Íntegro');
  }
  applyChange(path,next);render();return;
 }
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,v=visit(),p=patient();
 if(action==='nav'){navigate(b.dataset.tab);return;}
 if(action==='admission-new'||action==='admission-edit'){startAdmission(b.dataset.id);return;}
 if(action==='close-modal'){ui.modal=null;ui.admission=null;ui.batchText='';render();return;}
 if(action==='admission-save'){
  const a=ui.admission;if(!a.bed.trim()||!a.code.trim()){toast('Preencha leito e identificação.');return;}
  const duplicate=activePatients().find(p=>p.id!==a.id&&p.bed.trim().toUpperCase()===a.bed.trim().toUpperCase());if(duplicate){toast('Já existe um paciente ativo nesse leito. Edite ou registre o desfecho antes de outra admissão.');return;}
  const exists=db.patients.find(p=>p.id===a.id);const target=exists||{id:uid(),status:'active',visit:null,draft:null,history:[]};
  Object.assign(target,{bed:a.bed.trim().toUpperCase(),code:a.code.trim(),record:a.record.trim(),sector:a.sector,admission:{when:a.date?a.date+(a.time?'T'+a.time:''):'',origin:a.origin,reason:a.reason,notes:a.notes}});
  if(!exists)db.patients.push(target);ui.current=target.id;ui.modal=null;ui.admission=null;persist();ui.tab=target.status==='active'?'visita':'painel';ui.open.clear();render();window.scrollTo(0,0);return;
 }
 if(action==='open-patient'){syncCurrent();ui.current=b.dataset.id;ui.errors=[];ui.open.clear();navigate('visita');return;}
 if(action==='open-report'){ui.reportId=b.dataset.id;navigate('evolucao');return;}
 if(action==='new-round'){if(!p)return;if(!confirm('Iniciar nova visita? Os dados da visita salva serão preservados no histórico. Os achados e confirmações devem ser avaliados novamente.'))return;const before=clone(v);p.draft=freshRound(before);p.draft.carryTaskKeys=openTasks(db,p.id).filter(t=>t.autoKey).map(t=>t.autoKey);p.dirty=true;ui.errors=[];syncCurrent();render();window.scrollTo(0,0);return;}
 if(action==='add-sound')v.respiratory.sounds.push({id:uid(),type:'',sites:[]});
 if(action==='add-wound'){v.skin.integrity='Lesões presentes';v.skin.wounds.push({id:uid(),type:b.dataset.type,site:'',side:'',stage:'',dressing:'',description:'',needsChange:false});}
 if(action==='add-phlebitis')v.skin.phlebitis.push({id:uid(),site:'',side:'',grade:'',hirudoid:'',camomila:''});
 if(action==='toggle-prevention'){
  ui.open.add('prevention');if(!v.skin.prevention.length)v.skin.prevention=['Região sacral','Trocânter direito','Trocânter esquerdo','Calcanhar direito','Calcanhar esquerdo'].map(site=>({id:uid(),site,status:'',date:'',unknown:false}));
 }
 if(action==='add-device')addDevice(b.dataset.type,b.dataset.link);
 if(action==='remove-device'){
  const d=v.devices.find(x=>x.id===b.dataset.id);if(!d)return;
  const linked=v.infusions.some(x=>x.deviceId===d.id)||v.nutrition.deviceId===d.id||v.urinary.deviceId===d.id;
  if(!confirm('Remover '+deviceLabel(d)+'?'+(linked?' Os vínculos com este dispositivo serão desfeitos.':'')))return;
  v.carryTaskKeys=arr(v.carryTaskKeys).filter(k=>!k.endsWith(':'+d.id));v.devices=v.devices.filter(x=>x.id!==d.id);v.infusions.forEach(i=>{if(i.deviceId===d.id)i.deviceId='';});if(v.nutrition.deviceId===d.id)v.nutrition.deviceId='';if(v.urinary.deviceId===d.id)v.urinary.deviceId='';
 }
 if(action==='remove-row'){const list=value(v,b.dataset.list);if(Array.isArray(list))list.splice(Number(b.dataset.index),1);}
 if(action==='add-infusion')v.infusions.push({id:uid(),name:'',rate:'',date:'',time:'',deviceId:''});
 if(action==='next-manual-task'){manualPending(db,p,v);v.manualTask='';v.id=uid();}
 if(action==='save-visit'){saveVisit();return;}
 if(action==='task-done'||action==='task-reopen'){const t=db.tasks.find(t=>t.id===b.dataset.id);if(t){t.done=action==='task-done';t.doneAt=t.done?new Date().toISOString():null;t.resolved=false;}persist();render();return;}
 if(action==='export-json'){syncCurrent();download('ronda-backup-'+localISO().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');return;}
 if(action==='copy-one'){const selected=db.patients.find(x=>x.id===ui.reportId);if(!selected?.visit)return toast('Salve uma visita primeiro.');const ok=await copyText(buildReport(selected).text);toast(ok?'Evolução copiada: leito '+selected.bed+' · '+selected.code+'.':'Cópia bloqueada pelo navegador. Selecione o texto da evolução manualmente.');return;}
 if(action==='batch-open'){ui.batchIds=activePatients().filter(p=>p.visit?.savedAt).map(p=>p.id);ui.batchText='';ui.modal='batch';render();return;}
 if(action==='batch-preview'){ui.batchText=batchReport(activePatients().filter(p=>ui.batchIds.includes(p.id)));render();return;}
 if(action==='batch-copy'){if(!ui.batchText)return;const ok=await copyText(ui.batchText);if(ok)toast('Bloco copiado com '+ui.batchIds.length+' evolução(ões) identificada(s).');else{$('#batch-copy-text')?.focus();$('#batch-copy-text')?.select();toast('Selecione e copie o texto da prévia manualmente.');}return;}
 if(action==='print'){window.print();return;}
 if(p){p.dirty=true;syncCurrent();}render();
});
$('#app').addEventListener('input',e=>{
 const x=e.target;if(x.dataset.admission){ui.admission[x.dataset.admission]=x.value;return;}
 if(x.dataset.field&&x.type!=='checkbox'&&x.tagName!=='SELECT'){
  if(x.type==='number'&&!x.validity.valid)return;
  applyChange(x.dataset.field,x.value);const status=$('#draft-status');if(status)status.textContent=ui.storageError?'Não foi possível salvar — exporte backup':'Rascunho salvo neste aparelho';const summary=$('#visit-task-summary');if(summary)summary.innerHTML=currentTaskSummary();return;
 }
 if(x.hasAttribute('data-search')){ui.search=x.value;const pos=x.selectionStart;render();const next=$('[data-search]');next.focus();next.setSelectionRange(pos,pos);}
});
$('#app').addEventListener('change',async e=>{
 const x=e.target;
 if(x.dataset.admission){ui.admission[x.dataset.admission]=x.value;return;}
 if(x.dataset.field){if(x.type==='checkbox'||x.tagName==='SELECT'){applyChange(x.dataset.field,x.type==='checkbox'?x.checked:x.value);render();}else if(x.type!=='number'||x.validity.valid){applyChange(x.dataset.field,x.value);}return;}
 if(x.hasAttribute('data-switch-patient')){syncCurrent();ui.current=x.value;ui.errors=[];ui.open.clear();render();return;}
 if(x.hasAttribute('data-patient-filter')){ui.filter=x.value;render();return;}
 if(x.hasAttribute('data-report-patient')){ui.reportId=x.value;render();return;}
 if(x.dataset.batchId){ui.batchIds=x.checked?[...ui.batchIds,x.dataset.batchId]:ui.batchIds.filter(id=>id!==x.dataset.batchId);ui.batchText='';render();return;}
 if(x.dataset.manualFor&&x.value.trim()){db.tasks.push({id:uid(),patientId:x.dataset.manualFor,text:x.value.trim(),done:false,createdAt:new Date().toISOString()});persist();x.value='';render();return;}
 if(x.dataset.setting){const n=Number(x.value);if(!Number.isInteger(n)||n<1||n>(x.dataset.setting==='avpHours'?720:30)){toast('Informe um prazo válido.');return;}db.settings[x.dataset.setting]=n;activePatients().forEach(p=>syncTasks(db,p,p.draft||p.visit||blankVisit()));persist();render();return;}
 if(x.dataset.outcome&&x.value){const p=db.patients.find(p=>p.id===x.dataset.outcome);if(confirm('Registrar '+x.value+' do leito '+p.bed+' · '+p.code+'?')){p.status=x.value;p.outcomeAt=new Date().toISOString();if(ui.current===p.id)ui.current=activePatients()[0]?.id||'';persist();}render();return;}
 if(x.id==='import-backup'&&x.files?.[0]){try{const file=x.files[0];if(file.size>15_000_000)throw Error('Arquivo maior que 15 MB.');const data=normalizeDB(JSON.parse(await file.text()));if(!confirm(`Importar ${data.patients.length} paciente(s)? O conteúdo atual será substituído. Exporte um backup antes, se necessário.`))return;db=data;loadProblem='';ui.current=activePatients()[0]?.id||'';ui.tab='painel';ui.open.clear();persist();toast('Backup importado. Confira os cadastros e as visitas.');}catch(err){toast('Não foi possível importar: '+err.message);}return;}
});
$('#app').addEventListener('toggle',e=>{if(!e.target.isConnected||!e.target.dataset.open)return;const key=e.target.dataset.open;if(e.target.open)ui.open.add(key);else ui.open.delete(key);},true);
window.addEventListener('pagehide',()=>{syncCurrent();});
window.addEventListener('beforeprint',()=>{ui.tab='evolucao';render();});
window.addEventListener('online',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.getRegistration().then(r=>r?.update());});
