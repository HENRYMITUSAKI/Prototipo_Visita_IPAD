/* Cards de pacientes, pendências e avaliações rápidas */
.patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;align-items:start}
.patient-card{margin:0;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px;overflow-wrap:anywhere}
.patient-card header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:space-between}
.patient-card h3{font-size:20px;line-height:1.25;letter-spacing:-.3px}
.bed-number{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:11px;background:#e0f2ef;color:#095e65;font-size:26px;font-weight:800;letter-spacing:-.8px}
.patient-card .actions{margin-top:0;gap:7px}.patient-card .field{margin:0}
.patient-card .actions>.btn:first-child{flex:1;min-width:140px}.patient-card .actions>.btn{min-height:42px}
.patient-card-status{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.patient-card-status small{display:block;color:var(--muted);font-size:11px}
.deleted-patient{background:#f7f8fa;border-style:dashed}
.palliative-indicator{display:inline-flex;align-items:center;vertical-align:middle;gap:7px;flex:none}
.palliative-dot{display:inline-block;width:12px;height:12px;background:#8d49c3;border-radius:50%;box-shadow:0 0 0 3px #f0e5fa}
.blue-butterfly{display:inline-block;width:28px;height:28px;overflow:visible}

.fasting-reminder strong{font-size:11px;letter-spacing:.06em;flex:none}.fasting-reminder span{min-width:0}
.task-patient-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.task-patient-card{margin:0;min-width:0}.task-patient-card .toolbar{align-items:start}.task-patient-card h2{font-size:18px;margin:8px 0}
.task-patient-card .bed-number{font-size:22px}.task-cards{display:grid;gap:10px;margin-top:15px}
.task.task-card{margin:0;padding:13px;background:#f5f9fa;border:1px solid #d8e5e9;border-left:3px solid #4f9b9f;border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;overflow-wrap:anywhere}
.task-card p{line-height:1.4}.task-card .btn{min-height:38px;padding:7px 9px;font-size:11px}.task-card small{font-size:10px}
.quick-assessment{margin:12px 0}.quick-assessment>.field>.chips>.chip{min-width:110px;justify-content:center;font-size:15px;font-weight:750;min-height:46px}
.quick-assessment>.field>.chips>.chip.clear{min-width:40px;font-size:18px}
.quick-assessment>.field>.chips>.chip[data-value="Normal"].selected{background:#def3e5;border-color:#29986a;color:#155d3d;box-shadow:inset 0 0 0 1px #29986a}
.quick-assessment>.field>.chips>.chip[data-value="Alterado"].selected{background:#fff1da;border-color:#d89a42;color:#8b5416;box-shadow:inset 0 0 0 1px #d89a42}
.quick-summary{padding:12px 15px;border:1px solid #c3e5d6;background:#effaf3;border-radius:9px;color:#226d4a;font-size:13px;line-height:1.5}
.normal-help{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin:5px 0 10px}
.assessment-details{padding:4px 0}.companion-start{padding-top:16px;margin-top:16px;border-top:1px solid #dbe8e8}
.companion-start h3{font-size:16px;color:var(--teal)}
.report{background:white;line-height:1.6}.report pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:0}

.task-patient-card>.patient-diagnosis{margin-top:12px}

 ${d.type==='Dreno'?`<div class="nested">${choices(base+'.drain.type','Tipo de dreno',['Tórax','Mediastinal','Portovac','Blake','Jackson-Pratt','Penrose','Kehr','Pigtail','Outro'])}${d.drain.type==='Outro'?input(base+'.drain.otherType','Qual dreno?'):''}<div class="grid">${check(base+'.drain.noOutput','Sem débito')}${!d.drain.noOutput?input(base+'.drain.output','Débito (mL)','number','min="0" step="0.1"'):''}${input(base+'.drain.period','Período da quantificação','text','placeholder="Ex.: últimas 6h"')}</div>${choices(base+'.drain.aspect','Aspecto',['Seroso','Serossanguinolento','Sanguinolento','Purulento','Bilioso','Quiloso','Fecaloide','Outro'])}${d.drain.aspect==='Outro'?input(base+'.drain.aspectOther','Outro aspecto'):''}${choices(base+'.drain.color','Coloração',['Amarelo claro','Amarelo escuro','Róseo','Vermelho vivo','Vermelho escuro','Esverdeado','Esbranquiçado','Castanho','Outra'])}${d.drain.color==='Outra'?input(base+'.drain.colorOther','Outra coloração'):''}${d.drain.type==='Tórax'?choices(base+'.drain.oscillation','Oscilação',['Presente','Ausente','Não avaliada']):''}</div>`:''}`;}
function linkedDeviceUI(path,type){const id=value(visit(),path),index=visit().devices.findIndex(d=>d.id===id&&d.type===type);return `<div class="nested">${devicePicker(path,type)}${btn('+ Adicionar outra '+type.toLowerCase(),'add-device',`data-type="${type}" data-link="${path}"`)}${index>=0?deviceFields(visit().devices[index],index,true):'<p class="muted">Selecione ou adicione o dispositivo. O cadastro é compartilhado com a seção Dispositivos.</p>'}</div>`;}
function eliminationUI(){const v=visit(),u=v.urinary,b=v.bowel;return `<h3>Eliminações urinárias</h3>${choices('urinary.method','Via da diurese',['Espontânea','Sonda vesical','Cistostomia','Nefrostomia','Sem informação'])}${assessmentUI('urinary',`${choices('urinary.status','Diurese',['Presente','Ausente no período','Oligúria','Anúria'])}${choices('urinary.color','Coloração',['Amarelo claro','Amarelo escuro','Âmbar','Rósea','Avermelhada','Castanha','Incolor','Outra'])}${u.color==='Outra'?input('urinary.colorOther','Outra coloração'):''}<div class="grid">${choices('urinary.clumps','Grumos',['Ausentes','Presentes'])}${choices('urinary.blood','Sangramento visível',['Ausente','Presente'])}</div>`)}${choices('urinary.quantified','Diurese quantificada?',['Sim','Não'])}${u.quantified==='Sim'?`<div class="grid">${input('urinary.volume','Volume (mL)','number','min="0" step="0.1"')}${input('urinary.period','Período da quantificação','text','placeholder="Ex.: últimas 6h"')}</div>`:''}${URINARY_DEVICES.includes(u.method)?linkedDeviceUI('urinary.deviceId',u.method):''}
 <hr><h3>Eliminações intestinais</h3>${assessmentUI('bowel',`${choices('bowel.status','Evacuação',['Presente','Ausente no período'])}${b.status==='Presente'?choices('bowel.bristol','Consistência — Escala de Bristol',BRISTOL):''}${check('bowel.diarrhea','Diarreia')}${b.diarrhea?`<div class="grid">${input('bowel.days','Há quantos dias?','number','min="0" step="1"')}${input('bowel.episodes','Episódios nas últimas 24h','number','min="0" step="1"')}</div>`:''}`)}<div class="grid">${!b.unknown?input('bowel.lastDate','Data da última evacuação','date'):''}${check('bowel.unknown','Não sabe informar a data da última evacuação')}</div>${check('bowel.clostridium','Isolamento por Clostridioides difficile instituído')}`;}

function safetyUI(){const s=visit().safety;return `${choices('safety.meta1Status','Identificação do paciente',['Meta 1 OK','Não conformidade'])}${s.meta1Status==='Meta 1 OK'?'<p class="quick-summary">✓ Identificação conferida e pulseira de identificação presente e adequada.</p>':s.meta1Status==='Não conformidade'||s.idBand?`<div class="nested">${choices('safety.idBand','Pulseira de identificação',['Presente e adequada','Ausente','Necessita troca'])}${input('safety.meta1Reason','Descrever a não conformidade, se necessário')}</div>`:'<p class="muted">Meta 1 OK confirma a verificação da identificação e a pulseira adequada.</p>'}
 ${choices('safety.allergyStatus','Alergias informadas',['Negadas pelo paciente','Negadas pelo acompanhante','Negadas por ambos','Alergia conhecida','Não foi possível obter informação'])}${s.hasAllergy||s.allergyStatus==='Alergia conhecida'?input('safety.allergy','Qual alergia?')+choices('safety.allergyBand','Pulseira de alergia',['Presente e adequada','Ausente','Necessita troca']):''}
 ${assessmentUI('safety',`<div class="grid">${choices('safety.fallBand','Pulseira de risco de queda',['Presente e adequada','Ausente','Necessita troca','Não indicada conforme protocolo'])}${check('safety.wheels','Rodas travadas')}${check('safety.lowBed','Cama baixa')}${check('safety.headUp','Cabeceira elevada')}</div>`,'Demais medidas de segurança')}`;}

function nutritionUI(){const n=visit().nutrition;return `${choices('nutrition.routes','Via / situação da dieta',['Dieta oral','Dieta enteral','Jejum'],true)}${arr(n.routes).includes('Jejum')?`<div class="nested fasting-editor">${choices('nutrition.fastingKind','Motivo do jejum',['Clínico','Ag. procedimento','Ag. exame'])}${['Ag. procedimento','Ag. exame'].includes(n.fastingKind)?input('nutrition.awaiting',n.fastingKind==='Ag. procedimento'?'Qual procedimento aguarda?':'Qual exame aguarda?'):''}${!n.fastingKind?input('nutrition.reason','Motivo registrado / outras informações'):''}<p class="muted">O jejum e o que o paciente aguarda aparecem no card de pacientes.</p></div>`:assessmentUI('nutrition',arr(n.routes).includes('Dieta oral')?choices('nutrition.acceptance','Aceitação da dieta oral',['Boa aceitação','Aceitação parcial','Sem aceitação','Não avaliada']):'<p class="muted">Selecione a via de nutrição utilizada.</p>')}${arr(n.routes).includes('Dieta enteral')?linkedDeviceUI('nutrition.deviceId','Sonda enteral'):''}`;}

function devicesUI(){const v=visit();return `<div class="actions">${btn('Sem dispositivos','no-devices','','ghost small')}${DEVICE_TYPES.map(t=>btn('+ '+t,'add-device',`data-type="${t}"`,'secondary small')).join('')}</div>${v.devices.map((d,i)=>`<details class="repeater" data-open="device-${d.id}" ${ui.open.has('device-'+d.id)?'open':''}><summary>${esc(deviceLabel(d))} <span class="badge dim">${i+1}</span></summary><div class="toolbar">${d.type==='Outro'?input('devices.'+i+'.otherType','Nome do dispositivo'):''}${btn('Remover dispositivo','remove-device',`data-id="${d.id}"`,'danger small')}</div>${deviceFields(d,i)}</details>`).join('')||'<p class="empty">Nenhum dispositivo cadastrado. Use os botões acima.</p>'}${textArea('deviceNotes','Observações adicionais dos dispositivos')}`;}
function infusionsUI(){const v=visit();return `${v.infusions.map((i,idx)=>{const base='infusions.'+idx,d=v.devices.find(d=>d.id===i.deviceId),di=v.devices.indexOf(d);return `<div class="repeater"><header><h3>Infusão ${idx+1}${i.name?' · '+esc(i.name):''}</h3>${btn('Remover','remove-row',`data-list="infusions" data-index="${idx}"`,'danger small')}</header><div class="grid">${input(base+'.name','Medicação / solução')}${input(base+'.rate','Vazão (mL/h)','number','min="0" step="0.1"')}${input(base+'.date','Data de instalação','date')}${input(base+'.time','Hora (digitar HH:mm)','text','placeholder="08:30" inputmode="numeric" maxlength="5"')}</div>${devicePicker(base+'.deviceId','venous')}${!v.devices.some(d=>VENOUS.includes(d.type))?'<p class="notice">Cadastre primeiro um acesso venoso em Dispositivos.</p>':''}${d?.type==='AVP'?`<div class="nested"><p class="muted">Avaliação deste AVP — compartilhada com Dispositivos</p>${choices('devices.'+di+'.phlogistic','Sinais flogísticos',['Ausente','Presente','Não avaliado'])}${choices('devices.'+di+'.extravasation','Extravasamento',['Ausente','Presente','Não avaliado'])}</div>`:''}</div>`;}).join('')}${btn('+ Adicionar infusão','add-infusion')}`;}
function finishUI(){const f=visit().finish;return `${choices('finish.guidance','Verificações da Meta 5 e orientações finais realizadas?',['Sim','Não'])}<p class="muted">Sim confirma higiene das mãos e prevenção de infecções, cuidados com dispositivos, prevenção de quedas e lesões por pressão, campainha e pertences ao alcance e orientação para chamar a equipe.</p>${f.guidance==='Não'?textArea('finish.guidanceReason','Motivo de não realizar as orientações'):f.guidance==='Sim'?`<p class="quick-summary">✓ Orientações registradas para ${esc(recipientReport(visit()))}.</p>`:''}${f.guidance==='Sim'||f.fall||f.pressure?detail('education-details','Revisar destinatário e tópicos',`${choices('finish.recipient','Quem recebeu as orientações?',['Paciente','Acompanhante','Paciente e acompanhante'])}${input('finish.understanding','Compreensão / limitações observadas')}<div class="grid">${check('finish.handHygiene','Orientação de higiene das mãos')}${check('finish.infection','Prevenção de infecções')}${check('finish.deviceCare','Cuidados com sondas, cateteres e curativos')}${check('finish.fall','Prevenção de quedas e auxílio para mobilização')}${check('finish.pressure','Prevenção de lesão por pressão')}${check('finish.bell','Campainha ao alcance')}${check('finish.belongings','Utensílios pessoais ao alcance')}${check('finish.call','Orientado a chamar a equipe')}</div>`):''}${detail('finish-extra','Intercorrências, resposta e continuidade',textArea('events','Intercorrências, comunicação à equipe e condutas realizadas')+textArea('results','Resposta aos cuidados / reavaliação')+textArea('plan','Planejamento / continuidade da assistência'))}<div class="nested"><h3>Pendências pessoais</h3>${input('manualTask','Adicionar pendência — salva automaticamente','text','placeholder="Ex.: providenciar material"')}${btn('+ Outra pendência','next-manual-task','','ghost small')}<div id="visit-task-summary">${currentTaskSummary()}</div></div>`;}

function currentTaskSummary(){return openTasks(db,ui.current).map(t=>`<p class="muted">• ${esc(t.text)}</p>`).join('')||'<p class="muted">Nenhuma pendência aberta.</p>';}
function visitPatientList(){return `<section class="card empty"><h2>Selecione um paciente para avaliar</h2><p>Use Abrir visita no card do paciente.</p>${btn('Ver cards dos pacientes','nav','data-tab="painel"','')}</section>`;}

function visitView(){const p=patient();if(!p||p.status!=='active')return visitPatientList();const v=visit();return `<section class="card selected-patient"><div class="toolbar"><div><span class="eyebrow">Paciente em avaliação</span><h2>Leito ${esc(p.bed)} · ${esc(p.code)} ${palliativeIndicator(p)}</h2><p class="muted">Registro: ${esc(p.record||'não informado')} · ${esc(p.sector)}</p></div><div class="actions">${btn('Pacientes','nav','data-tab="painel"','ghost small')}${btn('Editar paciente','admission-edit',`data-id="${p.id}"`,'ghost small')}${btn('Nova visita','new-round','','ghost small')}</div></div>${diagnosisBox(p)}${companionUI()}${check('finish.palliative','Paciente em cuidados paliativos')}${fastingReminder(p)}<p class="muted">Rascunho salvo automaticamente. Salvar visita fixa a hora da evolução.</p></section>
 <nav class="jump no-print">${[['safety','Identificação'],['general','Estado geral'],['pain','Dor'],['resp','Respiratório'],['cardio','Cardiovascular'],['abd','Abdome'],['skin','Pele'],['nutrition','Nutrição'],['elimination','Eliminações'],['devices','Dispositivos'],['infusions','Infusões'],['finish','Finalizar']].map(([id,l])=>`<a href="#${id}">${l}</a>`).join('')}</nav>
 ${ui.errors.length?`<div class="notice error" role="alert"><strong>Complete ou revise antes de salvar:</strong><ul>${ui.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p>O rascunho permanece salvo.</p></div>`:''}
 ${section('safety','01','Identificação e segurança',safetyUI())}
 ${section('general','02','Estado geral e avaliação neurológica',generalUI())}
 ${section('pain','03','Dor',painUI())}
 ${section('resp','04','Respiratório e oxigenoterapia',respiratoryUI())}
 ${section('cardio','05','Cardiovascular',cardioUI())}
 ${section('abd','06','Abdome',abdomenUI())}
 ${section('mobility','07','Mobilidade',mobilityUI())}
 ${section('skin','08','Pele, lesões e prevenção',skinUI())}
 ${section('nutrition','09','Nutrição',nutritionUI())}
 ${section('elimination','10','Eliminações',eliminationUI())}
 ${section('findings','11','Observações adicionais',detail('physical-extra','Outras informações da avaliação',textArea('findings','Observações do exame físico')+(v.legacyNotes?`<p class="note">Registro anterior preservado: ${esc(v.legacyNotes)}</p>`:'')))}
 ${section('devices','12','Dispositivos instalados',devicesUI())}
 ${section('infusions','13','Infusões',infusionsUI())}
 ${section('finish','14','Condutas e fechamento',finishUI())}
 <div class="sticky no-print"><div><strong>Leito ${esc(p.bed)} · ${esc(p.code)}</strong><p class="muted" id="draft-status">Rascunho ${ui.storageError?'não salvo — exporte backup':'salvo neste aparelho'}</p></div><div class="actions">${btn('Pendências','nav','data-tab="pendencias"','ghost')}${btn('Salvar visita e gerar evolução','save-visit','','')}</div></div>`;}

function dashboard(){const active=activePatients(),list=db.patients.filter(p=>(ui.filter==='deleted'?!!p.deletedAt:!p.deletedAt&&(ui.filter==='all'||p.status==='active'))&&[p.bed,p.code,p.record,p.sector,p.diagnosis].join(' ').toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>a.bed.localeCompare(b.bed,'pt-BR',{numeric:true}));return `<section><div class="stats"><div class="stat"><strong>${active.length}</strong><span>Em acompanhamento</span></div><div class="stat"><strong>${active.filter(p=>p.visit).length}</strong><span>Com visita salva</span></div><div class="stat"><strong>${active.reduce((n,p)=>n+openTasks(db,p.id).length,0)}</strong><span>Pendências abertas</span></div></div><div class="card"><div class="toolbar"><h2>Pacientes</h2>${btn('+ Admissão','admission-new','','')}</div><div class="grid"><div class="field"><label>Buscar leito ou identificação</label><input data-search value="${esc(ui.search)}" placeholder="Ex.: 224B"></div><div class="field"><label>Mostrar</label><select data-patient-filter><option value="active" ${ui.filter==='active'?'selected':''}>Em acompanhamento</option><option value="all" ${ui.filter==='all'?'selected':''}>Todos, inclusive desfechos</option><option value="deleted" ${ui.filter==='deleted'?'selected':''}>Excluídos — restaurar cadastro</option></select></div></div></div><div class="patient-grid">${list.map(patientCard).join('')||'<div class="card empty">Nenhum paciente encontrado.</div>'}</div></section>`;}

function taskRow(t){return `<div class="task task-card ${t.done||t.resolved?'done':''}"><div><p>${esc(t.text)}</p><small class="muted">${t.done?'Concluída em '+stampBR(t.doneAt):t.resolved?'Condição atualizada — não marcada como executada':t.autoKey?'Da avaliação':'Manual'}</small></div>${t.done?btn('Reabrir','task-reopen',`data-id="${t.id}"`,'ghost small'):t.resolved?'':btn('Concluir','task-done',`data-id="${t.id}"`,'secondary small')}</div>`;}

function tasksView(){const pats=activePatients().sort((a,b)=>openTasks(db,b.id).length-openTasks(db,a.id).length||a.bed.localeCompare(b.bed,'pt-BR',{numeric:true}));return `<section><div class="card"><h2>Pendências por leito</h2><p class="muted">Tarefas visíveis por paciente. Conclua após realizar o cuidado.</p></div><div class="task-patient-grid">${pats.map(p=>{const open=openTasks(db,p.id),past=db.tasks.filter(t=>t.patientId===p.id&&(t.done||t.resolved));return `<article class="card task-patient-card"><div class="toolbar"><div><span class="bed-number">${esc(p.bed)}</span><h2>${esc(p.code)} ${palliativeIndicator(p)}</h2><span class="badge ${open.length?'warn':'dim'}">${open.length} aberta(s)</span></div>${btn('Abrir visita','open-patient',`data-id="${p.id}"`,'secondary small')}</div>${diagnosisBox(p)}<div class="task-cards">${open.map(taskRow).join('')||'<p class="note">Sem pendências abertas.</p>'}</div><div class="field"><label>+ Pendência — salva ao sair do campo</label><input data-manual-for="${p.id}" placeholder="Descreva a pendência"></div>${past.length?detail('past-'+p.id,`Concluídas / atualizadas (${past.length})`,past.map(taskRow).join('')):''}</article>`;}).join('')||'<div class="card empty">Nenhum paciente em acompanhamento.</div>'}</div></section>`;}

function identity(p){return `<div class="identity"><strong>Leito ${esc(p.bed)} · ${esc(p.code)}</strong><span>Registro: ${esc(p.record||'não informado')} · ${esc(p.sector)}</span><p class="muted">Visita salva: ${stampBR(p.visit?.savedAt)||'não salva'}</p></div>`;}
function reportView(){const candidates=db.patients.filter(p=>!p.deletedAt&&p.visit),p=candidates.find(p=>p.id===ui.reportId)||candidates.find(p=>p.id===ui.current)||candidates[0];if(p)ui.reportId=p.id;return `<section class="card print-target"><div class="toolbar no-print"><h2>Evolução de enfermagem</h2><div class="actions">${btn('Copiar todas as evoluções','batch-open','','')}${btn('Copiar esta evolução','copy-one','','secondary')}${btn('Imprimir','print','','ghost')}</div></div><div class="field no-print"><label>Paciente — confira antes de copiar</label><select data-report-patient>${candidates.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>Leito ${esc(x.bed)} · ${esc(x.code)} · ${stampBR(x.visit.savedAt)}</option>`).join('')}</select></div>${p?`${p.dirty?'<p class="notice no-print">Há rascunho em edição. Esta é a última visita salva.</p>':''}<p class="note no-print">Texto organizado conforme a visita salva. Confira a identificação e revise antes de copiar.</p><div class="report" id="report-text"><pre>${esc(buildReport(p).text)}</pre></div><div class="only-print print-signature">Conferido por: ______________________________ &nbsp; Registro profissional: __________________</div>`:'<p class="empty">Salve uma visita para gerar a evolução.</p>'}</section>`;}

function settingsView(){return `<section class="card"><h2>Dados e configuração</h2><p class="note">Os dados ficam neste navegador e não são sincronizados entre aparelhos. Exporte um backup antes de atualizar ou trocar de aparelho.</p><div class="actions">${btn('Exportar backup JSON','export-json','','')}<label class="btn secondary">Importar backup<input type="file" id="import-backup" accept=".json,application/json" hidden></label></div><hr><h3>Prazos do serviço</h3><div class="grid"><div class="field"><label>Avaliar AVP após (horas)</label><input data-setting="avpHours" type="number" min="1" max="720" value="${db.settings.avpHours}"></div><div class="field"><label>Curativos de outros acessos venosos (dias)</label><input data-setting="dressingDays" type="number" min="1" max="30" value="${db.settings.dressingDays}"></div></div><p class="muted">Valores iniciais solicitados: AVP 48h e curativos 7 dias. O AVP usa agora lembretes por data (48h correspondem a 2 dias de calendário), sem afirmar o horário exato de vencimento. São alertas para revisão, não uma ordem de retirada. Adeque ao protocolo e ao tipo de cobertura. Cateter longo sem expiração por permanência; seu curativo continua monitorado.</p></section><section class="card"><h2>Referências e limites das escalas</h2><p class="note">Glasgow, AVDI e FOUR têm registro por componentes. NIHSS registra o resultado obtido no instrumento completo. Faces registra a pontuação escolhida no instrumento oficial do serviço, sem substituir as imagens por desenhos não validados. PAINAD, CPOT e COMFORT-B não têm pontuação presumida para itens vazios. COMFORT-B registra seis itens de 1 a 5, sem classificar automaticamente dor ou sedação.</p><ul>${SOURCES.map(([label,url])=>`<li><a href="${url}" target="_blank" rel="noopener">${label}</a></li>`).join('')}</ul><p class="muted">Protótipo de apoio à documentação, sem integração ao prontuário. Resultados e textos exigem conferência profissional. Versão ${APP_VERSION}.</p></section>`;}
function admissionModal(){const a=ui.admission||{};const field=(key,label,type='text')=>`<div class="field"><label for="ad-${key}">${label}</label><input id="ad-${key}" data-admission="${key}" type="${type}" value="${esc(a[key]||'')}"></div>`;return `<div class="modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="admission-title"><header class="modal-head"><h2 id="admission-title">${a.id?'Editar paciente':'Adicionar paciente'}</h2>${btn('Fechar','close-modal','','ghost small')}</header><p class="muted">Editar mantém as visitas, dispositivos e pendências no mesmo cadastro.</p><div class="grid">${field('bed','Leito *')}${field('code','Identificação do paciente *')}${field('record','Registro / prontuário (opcional)')}${field('diagnosis','Diagnóstico')}<div class="field"><label>Setor</label><select data-admission="sector">${SECTORS.map(s=>`<option ${a.sector===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${field('date','Data da admissão','date')}${field('time','Hora da admissão (HH:mm)')}${field('origin','Procedência')}${field('reason','Motivo da admissão')}</div><div class="field"><label>Informações da admissão</label><textarea data-admission="notes">${esc(a.notes||'')}</textarea></div><div class="actions">${btn(a.id?'Salvar correções':'Cadastrar e iniciar visita','admission-save','','')}${btn('Cancelar','close-modal','','ghost')}</div></section></div>`;}
function batchModal(){const pats=activePatients().filter(p=>p.visit?.savedAt).sort((a,b)=>a.bed.localeCompare(b.bed,'pt-BR',{numeric:true}));return `<div class="modal-bg"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="batch-title"><header class="modal-head"><h2 id="batch-title">Copiar evoluções por paciente</h2>${btn('Fechar','close-modal','','ghost small')}</header><p class="note">Última visita salva de cada paciente selecionado. Rascunhos não salvos não entram na cópia. Os cabeçalhos servem para conferência; cada prontuário recebe apenas a evolução correspondente.</p>${pats.map(p=>`<label class="check"><input type="checkbox" data-batch-id="${p.id}" ${ui.batchIds.includes(p.id)?'checked':''}><span><strong>Leito ${esc(p.bed)} · ${esc(p.code)}</strong> · Registro ${esc(p.record||'não informado')}<small class="muted"> · ${stampBR(p.visit.savedAt)}${p.dirty?' · possui rascunho em edição':''}</small></span></label>`).join('')||'<p class="empty">Nenhuma visita salva em pacientes ativos.</p>'}<div class="actions">${btn('Preparar prévia separada','batch-preview','','secondary')}${btn('Copiar bloco revisado','batch-copy',ui.batchText?'':'disabled','')}</div>${ui.batchText?`<div class="field"><label>Prévia — início e fim identificados de cada evolução</label><textarea id="batch-copy-text" readonly style="min-height:330px">${esc(ui.batchText)}</textarea></div>`:''}</section></div>`;}
function render(){fieldCount=0;let scroll=window.scrollY;const focused=document.activeElement?.dataset.field,selection=document.activeElement?.selectionStart;
 const title={painel:['Acompanhamento','Painel de pacientes'],visita:['À beira-leito','Visita de enfermagem'],pendencias:['Continuidade do cuidado','Pendências por leito'],evolucao:['Registro assistencial','Evoluções de enfermagem'],dados:['Seu espaço de trabalho','Dados e referências']}[ui.tab];
 const content={painel:dashboard,visita:visitView,pendencias:tasksView,evolucao:reportView,dados:settingsView}[ui.tab]();
 $('#app').innerHTML=`<div class="shell"><aside><div class="brand"><span>✚</span> Ronda<small>VISITA DE ENFERMAGEM</small></div>${[['painel','▦ Pacientes'],['visita','✎ Visitas'],['pendencias','☑ Pendências'],['evolucao','▤ Evoluções'],['dados','⚙ Dados']].map(([tab,label])=>`<button class="nav ${ui.tab===tab?'active':''}" data-action="nav" data-tab="${tab}">${label}</button>`).join('')}<div class="sidefoot">Salvo neste navegador<br><span class="version">Ronda ${APP_VERSION}</span></div></aside><main><header class="top"><div><p class="eyebrow">${title[0]}</p><h1>${title[1]}</h1><p class="muted">Avaliar, acompanhar e registrar.</p></div><span class="badge dim">v${APP_VERSION}</span></header>${loadProblem?`<div class="notice error">${esc(loadProblem)}</div>`:''}${ui.storageError?'<div class="notice error">Não foi possível salvar os dados neste navegador. Exporte um backup.</div>':''}${ui.tab==='painel'?`<details class="note no-print"><summary>Protótipo de apoio — dados locais e revisão profissional</summary>Sem autenticação, criptografia de aplicação ou integração ao prontuário institucional. Use dados fictícios nos testes; a instituição deve autorizar o tratamento de dados assistenciais. Confira o texto antes de utilizá-lo.</details>`:''}${content}</main></div>${ui.modal==='admission'?admissionModal():ui.modal==='batch'?batchModal():''}${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}`;
 if(focused){const el=document.querySelector(`[data-field="${focused}"]`);if(el){el.focus({preventScroll:true});try{if(selection!==null)el.setSelectionRange(selection,selection);}catch{}}}window.scrollTo(0,scroll);
}
function navigate(tab){syncCurrent();ui.tab=tab;ui.errors=[];if(tab==='pendencias'||tab==='painel')for(const p of activePatients())syncTasks(db,p,p.draft||p.visit||blankVisit());persist();render();window.scrollTo(0,0);}
function startAdmission(id){syncCurrent();const p=db.patients.find(p=>p.id===id);ui.admission=p?{id:p.id,bed:p.bed,code:p.code,record:p.record,diagnosis:p.diagnosis||'',sector:p.sector,date:p.admission?.when?.slice(0,10)||'',time:p.admission?.when?.slice(11,16)||'',origin:p.admission?.origin||'',reason:p.admission?.reason||'',notes:p.admission?.notes||''}:{bed:'',code:'',record:'',diagnosis:'',sector:SECTORS[0],date:localISO().slice(0,10),time:localISO().slice(11,16),origin:'',reason:'',notes:''};ui.modal='admission';render();$('#ad-bed')?.focus();}
function addDevice(type,link){const v=visit(),d=newDevice(type);v.devices.push(d);if(link)put(v,link,d.id);ui.open.add('device-'+d.id);return d;}
function ensureLinked(path,type){const v=visit();if(v.devices.some(d=>d.id===value(v,path)&&d.type===type))return;const found=v.devices.find(d=>d.type===type);put(v,path,(found||addDevice(type)).id);}
function applyChange(path,newValue){const v=visit(),previous=value(v,path);if(path==='nutrition.fastingKind'&&previous!==newValue)v.nutrition.awaiting='';put(v,path,newValue);
 if(path==='nutrition.routes'){
  if(newValue.includes('Dieta enteral'))ensureLinked('nutrition.deviceId','Sonda enteral');
 }
 if(path==='urinary.method'&&URINARY_DEVICES.includes(newValue))ensureLinked('urinary.deviceId',newValue);
 if(path==='respiratory.adventitious'&&newValue==='Presentes'&&!v.respiratory.sounds.length)v.respiratory.sounds.push({id:uid(),type:'',sites:[]});
 if(path==='neuro.scale')ui.open.delete('neuro-switch');if(path==='pain.scale')ui.open.delete('pain-switch');
 if(path==='safety.hasAllergy'&&!newValue)v.safety.allergy='';
 if(path==='bowel.unknown'&&newValue)v.bowel.lastDate='';
 if(path.endsWith('.dateUnknown')&&newValue){const base=path.slice(0,-12);put(v,base+'.date','');put(v,base+'.time','');}
 if(path.endsWith('.dressing.unknown')&&newValue)put(v,path.replace(/unknown$/,'date'),'');
 if(path.endsWith('.dressingUnknown')&&newValue)put(v,path.replace(/dressingUnknown$/,'dressingDate'),'');
 if(path==='respiratory.adventitious'&&newValue==='Ausentes')v.respiratory.sounds=[];
 if(path==='cardio.implant'&&newValue==='Não identificado'){v.cardio.implantSite='';v.cardio.implantSide='';}
 document.querySelectorAll('[data-field]').forEach(el=>{if(el.dataset.field===path){if(el.type==='checkbox')el.checked=!!newValue;else el.value=newValue??'';}});
 applyQuickChange(v,path,newValue);const p=patient();if(p){p.dirty=true;if(path==='finish.palliative')p.palliative=!!newValue;}syncCurrent();
}
function saveVisit(){const p=patient();if(!p)return;const v=visit();let invalid=[...document.querySelectorAll('#app input[type="number"]')].filter(x=>!x.checkValidity());ui.errors=validateVisit(v);
 for(const x of invalid)ui.errors.push('Valor inválido: '+(document.querySelector(`label[for="${x.id}"]`)?.textContent||x.dataset.field));
 for(const i of v.infusions)if(i.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(i.time))ui.errors.push('Hora inválida na infusão '+(i.name||'')+': use HH:mm.');
 if(ui.errors.length){syncCurrent();render();$('.notice.error')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 const time=new Date();manualPending(db,p,v);syncTasks(db,p,v,time);if(p.visit){p.history ||= [];p.history.unshift(clone(p.visit));p.history=p.history.slice(0,50);}
 v.savedAt=time.toISOString();v.taskSnapshot=openTasks(db,p.id).map(t=>t.text);v.schema=3;p.visit=clone(v);p.dirty=false;
 p.visit.identity={bed:p.bed,code:p.code,record:p.record,sector:p.sector,diagnosis:p.diagnosis||''};
 if(!persist()){toast('A visita está na memória, mas não foi gravada. Exporte um backup.');return;}
 ui.reportId=p.id;ui.tab='evolucao';render();window.scrollTo(0,0);toast('Visita salva e evolução gerada. Confira antes de copiar.');
}
async function copyText(text){if(!text)return false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch{}const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='0';ta.style.top='0';ta.style.opacity='0';document.body.append(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}catch{}ta.remove();return ok;}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function assessmentUI(key,html,label='Avaliação'){
 const v=visit(),status=v.assessments[key]||'';
 const body=status==='Normal'?`<div class="quick-summary">✓ ${esc(normalSummary(v,key))}</div>`:status==='Alterado'||assessmentHasData(v,key)?`<div class="assessment-details">${html}</div>`:'<p class="muted">Selecione Normal ou Alterado para registrar esta avaliação.</p>';
 return `<div class="quick-assessment" data-assessment="${key}">${choices('assessments.'+key,label,['Normal','Alterado'])}${!status?`<small class="normal-help">Normal: ${esc(ASSESSMENT_HELP[key])}</small>`:''}${body}</div>`;
}
function companionUI(){const g=visit().general;return `<div class="companion-start"><h3>Acompanhante</h3>${choices('general.companion','Presença',['Acompanhado','Sem acompanhante'])}${g.companion==='Acompanhado'?`<div class="grid">${input('general.compName','Nome do acompanhante')}${input('general.compRelation','Vínculo / grau de parentesco')}</div>`:''}</div>`;}
function generalUI(){return `${assessmentUI('general',`<div class="grid">${choices('general.conscious','Estado de consciência',['Consciente','Sonolento','Obnubilado','Inconsciente'])}${choices('general.orientation','Orientação',['Orientado','Desorientado','Parcialmente orientado','Não avaliável'])}${choices('general.hydration','Hidratação',['Hidratado','Desidratado','Não avaliada'])}</div>${choices('general.pupils','Pupilas',['Isocóricas','Anisocóricas','Mióticas','Midriáticas'])}<div class="grid">${input('general.pupilRight','Diâmetro direito (mm)','number','min="0" max="12" step="0.1"')}${input('general.pupilLeft','Diâmetro esquerdo (mm)','number','min="0" max="12" step="0.1"')}${choices('general.reactRight','Fotorreação direita',['Presente','Ausente','Não avaliada'])}${choices('general.reactLeft','Fotorreação esquerda',['Presente','Ausente','Não avaliada'])}</div><div class="nested">${neuroUI()}</div>`)}<div class="grid">${choices('general.sleep','Sono referido',['Conseguiu dormir','Não conseguiu dormir','Sono interrompido'])}${choices('general.mattress','Colchão',['Pneumático','Piramidal','Viscoelástico','Outro'])}${visit().general.mattress==='Outro'?input('general.mattressOther','Qual colchão?'):''}</div>`;}
function palliativeIndicator(p){const v=p.draft||p.visit;if(!(typeof p.palliative==='boolean'?p.palliative:v?.finish?.palliative))return '';return `<span class="palliative-indicator" title="Cuidados paliativos" aria-label="Cuidados paliativos: bolinha roxa e borboleta azul"><span class="palliative-dot"></span><svg class="blue-butterfly" viewBox="0 0 24 24" aria-hidden="true"><path fill="#269be0" d="M11 10C4 0-3 5 5 13c-7 2-2 11 6 2V10zm2 0C20 0 27 5 19 13c7 2 2 11-6 2V10z"/><path fill="#164d74" d="M11 8h2v12h-2zM11 8 8 4l1-1 3 4 3-4 1 1-3 4z"/></svg></span>`;}
function fastingReminder(p){const current=p.draft?.nutrition,previous=!arr(current?.routes).length&&p.visit?.nutrition,n=previous||current||p.visit?.nutrition;if(!arr(n?.routes).includes('Jejum'))return '';const label=n.fastingKind==='Clínico'?'Clínico':n.fastingKind?(n.fastingKind+(n.awaiting?' · '+n.awaiting:'')):n.reason||'Motivo não informado';return `<div class="fasting-reminder"><strong>JEJUM</strong><span>${esc(label)}${previous?' · Último registro, conferir na visita':''}</span></div>`;}
function diagnosisBox(p){return `<div class="patient-diagnosis"><strong>Diagnóstico</strong><span>${esc(p.diagnosis||'Não informado')}</span></div>`;}
function patientCard(p){const pending=openTasks(db,p.id).length;return `<article class="card patient-card ${p.deletedAt?'deleted-patient':''}" data-patient-card="${p.id}"><header><span class="bed-number">${esc(p.bed)}</span>${palliativeIndicator(p)}<span class="badge ${p.deletedAt?'dim':p.status==='active'?'':'dim'}">${p.deletedAt?'Excluído':p.status==='active'?'Em acompanhamento':esc(p.status)}</span></header><h3>${esc(p.code)}</h3>${diagnosisBox(p)}<p class="muted">${esc(p.sector)}<br>Registro: ${esc(p.record||'não informado')}</p>${fastingReminder(p)}<div class="patient-card-status"><span class="badge ${pending?'warn':'dim'}">${pending} pendência(s)</span><small>${p.visit?'Visita: '+stampBR(p.visit.savedAt):'Sem visita salva'}${p.dirty?' · Rascunho':''}</small></div><div class="actions">${p.deletedAt?btn('Restaurar cadastro','restore-patient',`data-id="${p.id}"`,''):p.status==='active'?btn('Abrir visita','open-patient',`data-id="${p.id}"`,''):''}${btn('Editar','admission-edit',`data-id="${p.id}"`,'ghost small')}${!p.deletedAt&&p.visit?btn('Evolução','open-report',`data-id="${p.id}"`,'secondary small'):''}${!p.deletedAt?btn('Excluir','delete-patient',`data-id="${p.id}"`,'danger small'):''}</div>${!p.deletedAt&&p.status==='active'?`<div class="field"><label>Desfecho</label><select data-outcome="${p.id}" aria-label="Desfecho do leito ${esc(p.bed)}"><option value="">Selecionar…</option><option>Alta</option><option>Transferência</option><option>Óbito</option></select></div>`:''}</article>`;}

$('#app').addEventListener('click',async e=>{
 const chip=e.target.closest('[data-choice]');if(chip){const path=chip.dataset.choice;let next=chip.dataset.clear?(chip.dataset.multi?[]:''):chip.dataset.value;
  if(chip.dataset.multi&&!chip.dataset.clear){let xs=[...arr(value(visit(),path))];next=xs.includes(next)?xs.filter(x=>x!==next):[...xs,next];
   const selected=chip.dataset.value;
   if(path==='nutrition.routes'&&next.includes(selected)){next=selected==='Jejum'?['Jejum']:next.filter(x=>x!=='Jejum');}
   if(path==='skin.colors'&&next.includes(selected))for(const [x,y] of [['Corado','Hipocorado'],['Cianótico','Acianótico'],['Ictérico','Anictérico']])if([x,y].includes(selected))next=next.filter(i=>i!==(selected===x?y:x));
   if(path.endsWith('.dressing.state')&&next.includes(selected))next=selected==='Íntegro'?['Íntegro']:next.filter(x=>x!=='Íntegro');
  }
  applyChange(path,next);render();return;
 }
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,v=visit(),p=patient();
 if(action==='nav'){navigate(b.dataset.tab);return;}
 if(action==='admission-new'||action==='admission-edit'){startAdmission(b.dataset.id);return;}
 if(action==='close-modal'){ui.modal=null;ui.admission=null;ui.batchText='';render();return;}
 if(action==='admission-save'){
  const a=ui.admission;if(!a.bed.trim()||!a.code.trim()){toast('Preencha leito e identificação.');return;}
  const duplicate=activePatients().find(p=>p.id!==a.id&&p.bed.trim().toUpperCase()===a.bed.trim().toUpperCase());if(duplicate){toast('Já existe um paciente ativo nesse leito. Edite ou registre o desfecho antes de outra admissão.');return;}
  const exists=db.patients.find(p=>p.id===a.id);const target=exists||{id:uid(),status:'active',visit:null,draft:null,history:[]};
  Object.assign(target,{bed:a.bed.trim().toUpperCase(),code:a.code.trim(),record:(a.record||'').trim(),diagnosis:(a.diagnosis||'').trim(),sector:a.sector,admission:{when:a.date?a.date+(a.time?'T'+a.time:''):'',origin:a.origin,reason:a.reason,notes:a.notes}});
  if(!exists)db.patients.push(target);ui.current=target.id;ui.modal=null;ui.admission=null;persist();ui.tab=target.status==='active'&&!target.deletedAt?'visita':'painel';ui.open.clear();render();window.scrollTo(0,0);return;
 }
 if(action==='open-patient'){if(!activePatients().some(x=>x.id===b.dataset.id))return;syncCurrent();ui.current=b.dataset.id;ui.errors=[];ui.open.clear();navigate('visita');return;}
 if(action==='open-report'){ui.reportId=b.dataset.id;navigate('evolucao');return;}
 if(action==='delete-patient'){
  const target=db.patients.find(x=>x.id===b.dataset.id&&!x.deletedAt);if(!target)return;
  if(!confirm(`Excluir o cadastro do leito ${target.bed} · ${target.code}? Ele sairá dos quadros e poderá ser restaurado em Excluídos.`))return;
  syncCurrent();target.deletedAt=new Date().toISOString();if(ui.current===target.id)ui.current=activePatients()[0]?.id||'';if(ui.reportId===target.id)ui.reportId='';ui.batchText='';ui.batchIds=ui.batchIds.filter(id=>id!==target.id);ui.tab='painel';persist();toast('Cadastro excluído. Você pode restaurá-lo no filtro Excluídos.');return;
 }
 if(action==='restore-patient'){
  const target=db.patients.find(x=>x.id===b.dataset.id&&x.deletedAt);if(!target)return;
  if(target.status==='active'&&activePatients().some(x=>x.bed.toUpperCase()===target.bed.toUpperCase()))return toast('Este leito já está ocupado. Edite o leito do cadastro excluído antes de restaurar.');
  delete target.deletedAt;ui.filter=target.status==='active'?'active':'all';syncTasks(db,target,target.draft||target.visit||blankVisit());persist();toast('Cadastro restaurado com suas visitas e pendências.');return;
 }
 if(action==='no-devices'){if(v.devices.length)return toast('Remova os dispositivos cadastrados antes de registrar ausência.');v.deviceStatus='Sem dispositivos';p.dirty=true;syncCurrent();render();return;}
 if(action==='new-round'){if(!p)return;if(!confirm('Iniciar nova visita? Os dados da visita salva serão preservados no histórico. Os achados e confirmações devem ser avaliados novamente.'))return;const before=clone(v);p.draft=freshRound(before);p.draft.carryTaskKeys=openTasks(db,p.id).filter(t=>t.autoKey).map(t=>t.autoKey);p.dirty=true;ui.errors=[];syncCurrent();render();window.scrollTo(0,0);return;}
 if(action==='add-sound')v.respiratory.sounds.push({id:uid(),type:'',sites:[]});
 if(action==='add-wound'){v.assessments.skin='Alterado';v.skin.integrity='Lesões presentes';v.skin.wounds.push({id:uid(),type:b.dataset.type,site:'',side:'',stage:'',dressing:'',description:'',needsChange:false});}
 if(action==='add-phlebitis'){v.assessments.skin='Alterado';v.skin.phlebitis.push({id:uid(),site:'',side:'',grade:'',hirudoid:'',camomila:''});}
 if(action==='toggle-prevention'){
  ui.open.add('prevention');if(!v.skin.prevention.length)v.skin.prevention=['Região sacral','Trocânter direito','Trocânter esquerdo','Calcanhar direito','Calcanhar esquerdo'].map(site=>({id:uid(),site,status:'',date:'',unknown:false}));
 }
 if(action==='add-device'){addDevice(b.dataset.type,b.dataset.link);v.deviceStatus='Cadastrados';}
 if(action==='remove-device'){
  const d=v.devices.find(x=>x.id===b.dataset.id);if(!d)return;
  const linked=v.infusions.some(x=>x.deviceId===d.id)||v.nutrition.deviceId===d.id||v.urinary.deviceId===d.id;
  if(!confirm('Remover '+deviceLabel(d)+'?'+(linked?' Os vínculos com este dispositivo serão desfeitos.':'')))return;
  v.carryTaskKeys=arr(v.carryTaskKeys).filter(k=>!k.endsWith(':'+d.id));v.devices=v.devices.filter(x=>x.id!==d.id);v.infusions.forEach(i=>{if(i.deviceId===d.id)i.deviceId='';});if(v.nutrition.deviceId===d.id)v.nutrition.deviceId='';if(v.urinary.deviceId===d.id)v.urinary.deviceId='';
 }
 if(action==='remove-row'){const list=value(v,b.dataset.list);if(Array.isArray(list))list.splice(Number(b.dataset.index),1);}
 if(action==='add-infusion')v.infusions.push({id:uid(),name:'',rate:'',date:'',time:'',deviceId:''});
 if(action==='next-manual-task'){manualPending(db,p,v);v.manualTask='';v.id=uid();}
 if(action==='save-visit'){saveVisit();return;}
 if(action==='task-done'||action==='task-reopen'){const t=db.tasks.find(t=>t.id===b.dataset.id);if(t){t.done=action==='task-done';t.doneAt=t.done?new Date().toISOString():null;t.resolved=false;}persist();render();return;}
 if(action==='export-json'){syncCurrent();download('ronda-backup-'+localISO().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');return;}
 if(action==='copy-one'){const selected=db.patients.find(x=>x.id===ui.reportId);if(!selected?.visit||selected.deletedAt)return toast('Salve uma visita primeiro.');const ok=await copyText(buildReport(selected).text);toast(ok?'Evolução copiada: leito '+selected.bed+' · '+selected.code+'.':'Cópia bloqueada pelo navegador. Selecione o texto da evolução manualmente.');return;}
 if(action==='batch-open'){ui.batchIds=activePatients().filter(p=>p.visit?.savedAt).map(p=>p.id);ui.batchText='';ui.modal='batch';render();return;}
 if(action==='batch-preview'){ui.batchText=batchReport(activePatients().filter(p=>ui.batchIds.includes(p.id)));render();return;}
 if(action==='batch-copy'){if(!ui.batchText)return;const ok=await copyText(ui.batchText);if(ok)toast('Bloco copiado com '+ui.batchIds.length+' evolução(ões) identificada(s).');else{$('#batch-copy-text')?.focus();$('#batch-copy-text')?.select();toast('Selecione e copie o texto da prévia manualmente.');}return;}
 if(action==='print'){window.print();return;}
 if(p){p.dirty=true;syncCurrent();}render();
});
$('#app').addEventListener('input',e=>{
 const x=e.target;if(x.dataset.admission){ui.admission[x.dataset.admission]=x.value;return;}
 if(x.dataset.field&&x.type!=='checkbox'&&x.tagName!=='SELECT'){
  if(x.type==='number'&&!x.validity.valid)return;
  applyChange(x.dataset.field,x.value);const status=$('#draft-status');if(status)status.textContent=ui.storageError?'Não foi possível salvar — exporte backup':'Rascunho salvo neste aparelho';const summary=$('#visit-task-summary');if(summary)summary.innerHTML=currentTaskSummary();return;
 }
 if(x.hasAttribute('data-search')){ui.search=x.value;const pos=x.selectionStart;render();const next=$('[data-search]');next.focus();next.setSelectionRange(pos,pos);}
});
$('#app').addEventListener('change',async e=>{
 const x=e.target;
 if(x.dataset.admission){ui.admission[x.dataset.admission]=x.value;return;}
 if(x.dataset.field){if(x.type==='checkbox'||x.tagName==='SELECT'){applyChange(x.dataset.field,x.type==='checkbox'?x.checked:x.value);render();}else if(x.type!=='number'||x.validity.valid){applyChange(x.dataset.field,x.value);}return;}
 if(x.hasAttribute('data-switch-patient')){syncCurrent();ui.current=x.value;ui.errors=[];ui.open.clear();render();return;}
 if(x.hasAttribute('data-patient-filter')){ui.filter=x.value;render();return;}
 if(x.hasAttribute('data-report-patient')){ui.reportId=x.value;render();return;}
 if(x.dataset.batchId){ui.batchIds=x.checked?[...ui.batchIds,x.dataset.batchId]:ui.batchIds.filter(id=>id!==x.dataset.batchId);ui.batchText='';render();return;}
 if(x.dataset.manualFor&&x.value.trim()){db.tasks.push({id:uid(),patientId:x.dataset.manualFor,text:x.value.trim(),done:false,createdAt:new Date().toISOString()});persist();x.value='';render();return;}
 if(x.dataset.setting){const n=Number(x.value);if(!Number.isInteger(n)||n<1||n>(x.dataset.setting==='avpHours'?720:30)){toast('Informe um prazo válido.');return;}db.settings[x.dataset.setting]=n;activePatients().forEach(p=>syncTasks(db,p,p.draft||p.visit||blankVisit()));persist();render();return;}
 if(x.dataset.outcome&&x.value){const p=db.patients.find(p=>p.id===x.dataset.outcome);if(confirm('Registrar '+x.value+' do leito '+p.bed+' · '+p.code+'?')){p.status=x.value;p.outcomeAt=new Date().toISOString();if(ui.current===p.id)ui.current=activePatients()[0]?.id||'';persist();}render();return;}
 if(x.id==='import-backup'&&x.files?.[0]){try{const file=x.files[0];if(file.size>15_000_000)throw Error('Arquivo maior que 15 MB.');const data=normalizeDB(JSON.parse(await file.text()));if(!confirm(`Importar ${data.patients.length} paciente(s)? O conteúdo atual será substituído. Exporte um backup antes, se necessário.`))return;db=data;loadProblem='';ui.current=activePatients()[0]?.id||'';ui.tab='painel';ui.open.clear();persist();toast('Backup importado. Confira os cadastros e as visitas.');}catch(err){toast('Não foi possível importar: '+err.message);}return;}
});
$('#app').addEventListener('toggle',e=>{if(!e.target.isConnected||!e.target.dataset.open)return;const key=e.target.dataset.open;if(e.target.open)ui.open.add(key);else ui.open.delete(key);},true);
window.addEventListener('pagehide',()=>{syncCurrent();});
window.addEventListener('beforeprint',()=>{ui.tab='evolucao';render();});
window.addEventListener('online',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.getRegistration().then(r=>r?.update());});
setInterval(()=>{activePatients().forEach(p=>syncTasks(db,p,p.draft||p.visit||blankVisit()));persist();if(['painel','pendencias'].includes(ui.tab)&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA')render();},60000);
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
